buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.7.2' }
}
apply plugin: 'com.android.library'

android {
    namespace "app.homesafe.vault"
    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 23
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 35
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories { google(); mavenCentral() }

dependencies {
    implementation project(':capacitor-android')
    implementation 'androidx.documentfile:documentfile:1.0.1'
    // capacitor-android keeps these as private dependencies, so the plugin must declare its own.
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.80'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

// Signing parity: the JUnit test reads the shared protocol/test-vectors.json (identical to the Vault's copy).
android.testOptions.unitTests.all {
    systemProperty 'homesafe.vectors', new File(projectDir.canonicalFile, '../../../protocol/test-vectors.json').canonicalPath
}
