# HomeSafe (mobile): tests, Android debug APK + signing parity, and the iOS simulator build.
# Every job runs on every push, pull request and manual run. Nothing is optional: if any step of any job
# fails, or any job is skipped, the "All mobile checks passed" job fails, so the whole workflow fails.
name: Mobile build

on:
  push:
    branches: [main, prod-ready]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Both repos must carry the byte-identical protocol/test-vectors.json. If you change it,
  # change it in BOTH repos and update the hash below in BOTH workflows (sha256sum <file>).
  vectors-guard:
    name: Shared protocol vectors unchanged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "856ded0e2e2fda1f76d94a1a1715fa1a916888d79804e5c7706afb1d23a2ffa5  protocol/test-vectors.json" | sha256sum -c -

  web-tests:
    name: "Screens - tests and typecheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx vitest run
      - run: bunx tsc --noEmit

  android-apk:
    name: Android debug APK
    needs: [vectors-guard, web-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"   # Capacitor 7 compiles with Java 21
      - name: Android SDK (runner's preinstalled copy)
        run: |
          SDKM="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4

      - run: bun install --frozen-lockfile
      - run: npm run build:mobile

      - name: Create and sync the Android project
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Use a stable debug signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            CLEAN="$(printf '%s' "$KEYSTORE_B64" | tr -d ' \t\r\n"'"'"'')"
            # Copy/paste often drops the trailing "=" padding; restore it.
            while [ $(( ${#CLEAN} % 4 )) -ne 0 ]; do CLEAN="${CLEAN}="; done
            echo "Secret length: ${#KEYSTORE_B64} chars (${#CLEAN} after cleaning and padding)"
            BAD="$(printf '%s' "$CLEAN" | tr -d 'A-Za-z0-9+/=' | wc -c | tr -d ' ')"
            echo "Characters outside the base64 alphabet: $BAD"
            OK=0
            if printf '%s' "$CLEAN" | base64 -d > ~/.android/debug.keystore 2> /tmp/b64.err; then
              echo "Decoded size: $(wc -c < ~/.android/debug.keystore) bytes"
              if keytool -list -keystore ~/.android/debug.keystore -storepass android > /tmp/kt.out 2>&1; then OK=1; else echo "keytool said:"; head -5 /tmp/kt.out; fi
            else
              echo "base64 said:"; head -3 /tmp/b64.err
            fi
            if [ "$OK" = 1 ]; then
              echo "Using the stored debug keystore."
            else
              rm -f ~/.android/debug.keystore
              echo "::error::ANDROID_DEBUG_KEYSTORE_B64 is not a valid base64 keystore with password 'android'. Re-create the secret with: base64 -w0 debug.keystore (see the lines above for why)."
              exit 1
            fi
          else
            echo "::warning::No ANDROID_DEBUG_KEYSTORE_B64 secret. Every build is signed with a new key, so Android will refuse to update an installed copy: uninstall first (this removes the phone's pairing)."
          fi

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: homesafe-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

  # Signing parity: the Java canonical-JSON code against protocol/test-vectors.json.
  android-signing-parity:
    name: Android signing parity (JUnit)
    needs: [vectors-guard, web-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Android SDK (runner's preinstalled copy)
        run: |
          SDKM="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - run: bun install --frozen-lockfile
      - run: npm run build:mobile
      - run: |
          [ -d android ] || npx cap add android
          npx cap sync android
      - name: Run the plugin unit tests
        working-directory: android
        run: ./gradlew :homesafe-vault-native:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-parity-test-report
          path: native/homesafe-vault/android/build/reports/tests
          if-no-files-found: ignore

  ios-compile:
    name: iOS compile check (simulator, unsigned)
    needs: [vectors-guard, web-tests]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm run build:mobile
      - name: Create and sync the iOS project
        run: |
          # `cap add` runs pod install itself, which fails while the template still says iOS 14.
          # Ignore that one failure, raise the target, then sync for real below.
          if [ ! -d ios ]; then npx cap add ios || echo "cap add stopped at pod install (expected); fixing the target next"; fi
          test -f ios/App/Podfile
          # Google ML Kit (QR scanner) needs iOS 15.5; Capacitor 7's template defaults to 14.
          sed -i '' "s/platform :ios, '14.0'/platform :ios, '15.5'/" ios/App/Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.5;/g' ios/App/App.xcodeproj/project.pbxproj
          echo "--- Podfile platform:"; grep -n "platform :ios" ios/App/Podfile
          echo "--- plugin podspec:"; grep -n "deployment_target\|dependency" node_modules/homesafe-vault-native/HomesafeVaultNative.podspec
          if ! npx cap sync ios; then
            echo "::group::pod install --verbose (diagnostics)"
            (cd ios/App && pod install --repo-update --verbose 2>&1 | tail -80) || true
            echo "::endgroup::"
            exit 1
          fi
      - name: Compile for the iOS Simulator
        run: |
          if [ -d ios/App/App.xcworkspace ]; then TARGET=(-workspace ios/App/App.xcworkspace); else TARGET=(-project ios/App/App.xcodeproj); fi
          xcodebuild "${TARGET[@]}" -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO -derivedDataPath build/ios build

      - name: Package the simulator app
        run: |
          APP="$(find build/ios/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP" && test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" HomeSafe-ios-simulator.zip

      - uses: actions/upload-artifact@v4
        with:
          name: homesafe-ios-simulator-app
          path: HomeSafe-ios-simulator.zip
          retention-days: 14
          if-no-files-found: error

  # Single result for branch protection: every job above must have succeeded. A skipped, cancelled or failed job fails this.
  build-status:
    name: All mobile checks passed
    if: ${{ always() }}
    needs: [vectors-guard, web-tests, android-apk, android-signing-parity, ios-compile]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
